name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. npm 12 requires
      # Node 22+, and better-sqlite3 has no prebuilt binary for Node 22 or 24.
      - run: npm install -g npm@^11

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish
        if: github.event_name == 'release'
        run: npm publish

      # A manual run validates the whole pipeline without consuming a version.
      - name: Publish (dry run)
        if: github.event_name != 'release'
        run: npm publish --dry-run
